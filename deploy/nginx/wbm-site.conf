# wbmband.com: static Nuxt `generate` output, served from /var/www/wbmband.
# Installed as /etc/nginx/sites-available/wbm-site (symlinked into sites-enabled).
# Install/refresh: see deploy/nginx/README.md. This file is the source of truth for the
# production routing contract; public/.htaccess and public/_redirects only serve the
# legacy/GitHub Pages fallbacks.
#
# Requires: snippets/wbm-site-headers.conf, libnginx-mod-http-brotli-{filter,static}.

server {
    listen 80;
    listen [::]:80;
    server_name wbmband.com www.wbmband.com;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://www.wbmband.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name wbmband.com;
    server_tokens off;
    ssl_certificate     /etc/letsencrypt/live/wbmband.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wbmband.com/privkey.pem;
    return 301 https://www.wbmband.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.wbmband.com;
    server_tokens off;
    ssl_certificate     /etc/letsencrypt/live/wbmband.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wbmband.com/privkey.pem;

    root /var/www/wbmband;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/xml text/css text/javascript application/javascript application/json
               application/xml application/manifest+json image/svg+xml image/x-icon;
    brotli on;
    brotli_comp_level 5;
    brotli_types text/plain text/xml text/css text/javascript application/javascript application/json
                 application/xml application/manifest+json image/svg+xml image/x-icon;

    include snippets/wbm-site-headers.conf;

    # Legacy locale prefix /ua/... -> /...
    rewrite ^/ua$ / permanent;
    rewrite ^/ua/(.*)$ /$1 permanent;
    # The generated files are directories with index.html; only the clean URL is canonical.
    rewrite ^/index\.html$ / permanent;
    rewrite ^/(.+)/index\.html$ /$1 permanent;
    # Canonical: no trailing slash
    rewrite ^/(.+)/$ /$1 permanent;
    # Collapse doubled slashes (/listen//alina) into one redirect; $uri is already merged.
    if ($request_uri ~ "^[^?]*//") { return 301 $uri$is_args$args; }

    # Unknown URLs get a real 404. 404.html is Nuxt's SPA shell, so the client still renders
    # the localized error page. There is deliberately no 200 SPA fallback: every page is
    # prerendered, and a catch-all 200 turned typos and stale chunk requests into soft 404s.
    error_page 404 /404.html;
    location = /404.html { internal; add_header Cache-Control "no-cache" always; include snippets/wbm-site-headers.conf; }

    # never serve dotfiles (.htaccess, .nojekyll) except ACME
    location ~ /\.(?!well-known) { return 404; }
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location = /sitemap.xml {
        types { } default_type application/xml;
        add_header Cache-Control "public, max-age=3600" always;
        include snippets/wbm-site-headers.conf;
    }

    # Content-hashed build output: cache forever.
    location ^~ /_nuxt/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/wbm-site-headers.conf;
    }
    location ^~ /_fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/wbm-site-headers.conf;
    }

    # Images keep their URL when re-encoded, so a year without `immutable`.
    location ^~ /images/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000" always;
        include snippets/wbm-site-headers.conf;
    }

    # Per-route payloads and small text files change on every deploy.
    location ~* \.(?:json|txt|xml|md)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        include snippets/wbm-site-headers.conf;
    }

    # Release hero clips + posters (docs/hero-media.md): re-encodes keep the URL, so a
    # year without `immutable`, like images. Static files serve byte ranges as is.
    location ^~ /videos/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000" always;
        include snippets/wbm-site-headers.conf;
    }

    # Remaining static files (favicons, manifest, fonts, root-level images).
    location ~* \.(?:js|css|map|svg|ico|png|jpe?g|webp|avif|gif|woff2?|ttf|webmanifest|pdf)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000" always;
        include snippets/wbm-site-headers.conf;
    }

    # Pages: real file -> directory index (clean URLs without redirect) -> 404.
    location / {
        try_files $uri $uri/index.html $uri.html =404;
        add_header Cache-Control "no-cache" always;
        include snippets/wbm-site-headers.conf;
    }
}
