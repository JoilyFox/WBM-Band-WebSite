# Security headers for www.wbmband.com.
# Installed as /etc/nginx/snippets/wbm-site-headers.conf.
#
# nginx drops every inherited add_header as soon as a location sets its own, so each
# location in wbm-site.conf that adds Cache-Control includes this file again.

# No includeSubDomains: other *.wbmband.com hosts (app, ops, affine) live on the same box
# and must not be pinned by a header they don't control.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# Clickjacking only. A full script-src policy needs hashes for Nuxt's inline payload
# and JSON-LD scripts plus the GA/GTM hosts; add it as Report-Only first if ever needed.
add_header Content-Security-Policy "frame-ancestors 'self'" always;
