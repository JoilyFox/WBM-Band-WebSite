name: Tests

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  # Fast suites — lint + unit (node) + nuxt (component/integration). Gives quick
  # PR feedback and is the same set the husky pre-push hook runs locally.
  test:
    name: Lint + unit/nuxt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit + Nuxt tests
        run: npm run test

  # E2E builds the static site and drives a real browser — slower, so it runs
  # only after the fast suites pass.
  e2e:
    name: E2E (prerendered output + browser)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright-core install --with-deps chromium

      - name: Build static site + run e2e
        run: npm run test:e2e
